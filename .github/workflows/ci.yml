name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          "$(go env GOPATH)/bin/golangci-lint" run

      - name: Unit tests
        run: go test ./internal/... -race

      - name: Check generated mocks are up to date
        run: |
          go generate ./...
          git diff --exit-code

      - name: Integration tests
        run: |
          go build -o url-shortener ./cmd/url-shortener
          CONFIG_PATH=./config/local.yaml ./url-shortener &
          for i in $(seq 1 20); do curl -s -o /dev/null http://localhost:8082/ && break; sleep 0.5; done
          go test ./tests/... -race

      - name: Docker build
        run: docker build -t url-shortener:ci .
