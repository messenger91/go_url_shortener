# config.yaml

version: "0.1.0"
env: "local" # local,dev,prod
storage_path: "./storage.db" # sqlite db file
alias_length: 8 # alias length
http_server: # http server config
  address: "localhost:8082"
  timeout: 4s
  idle_timeout: 30s
  user: "admin"
  password: "admin"
  rate_limit: 10 # per-IP redirects per second
  rate_burst: 20 # burst size above the steady rate